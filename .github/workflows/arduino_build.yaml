name: Arduino Build Check (ESP32)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.board }} ${{ matrix.variant || 'full' }}
    runs-on: ubuntu-latest

    # Two boards times two variants. Building only one board leaves a change
    # that breaks the other invisible until someone builds it by hand — and the
    # FireBeetle is the one nobody builds by habit.
    strategy:
      fail-fast: false
      matrix:
        board: [ lolin, fire ]
        variant: [ "", lite ]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries
        run: |
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "ArduinoJson"

      # Compiled against the real board FQBNs, not a generic esp32: the
      # descriptors are validated at compile time and a generic target would
      # not exercise them.
      #
      # Adafruit NeoPixel and ArduinoJson are the only external libraries the
      # firmware still needs — NeoPixel for drivers::NeoPixelIndicator, and
      # ArduinoJson for the web server's REST payloads.
      - name: Compile
        run: ./build.sh ${{ matrix.board }} ${{ matrix.variant }}
